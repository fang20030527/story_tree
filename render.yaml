services:
  - type: web
    name: waikan-api
    runtime: node
    repo: https://github.com/fang20030527/story_tree
    region: singapore
    plan: free
    branch: codex/cloudflare-api-migration
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build --workspace=@context-reader/server
    startCommand: npm run start:compat --workspace=@context-reader/server
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: HOST
        value: 0.0.0.0
      - key: CLOUDFLARE_API_ORIGIN
        value: https://waikan-api.zhenyufang162.workers.dev
