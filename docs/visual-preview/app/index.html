<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf6">
  <title>黑洞英语 · 完整页面原型</title>
  <link rel="icon" href="/app/assets/images/black-hole-english-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="workbench-header">
    <a class="workbench-brand" href="#home"><img src="/app/assets/images/black-hole-english-logo.svg" alt="">黑洞英语 <span>红粉阅读室</span></a>
    <nav class="app-platform-nav" aria-label="切换平台原型"><a href="http://127.0.0.1:8768/#home" aria-current="page">手机</a><a href="http://127.0.0.1:8769/#home">iPad</a><a href="http://127.0.0.1:8770/#home">小程序</a><a href="http://127.0.0.1:8771/#home">Web</a></nav>
    <div class="workbench-views"><button id="gallery-toggle" type="button">页面总览</button><a href="http://127.0.0.1:8767/">第二版首页</a><a href="http://127.0.0.1:8766/">第一版</a></div>
  </header>
  <main class="workbench" id="workbench">
    <aside class="page-index" aria-label="原型页面目录"><div class="index-title"><span>页面目录</span><span id="page-count"></span></div><div id="page-links"></div><p class="index-foot">所有交互均为本地示例，<br>不连接账号、生成服务或数据库。</p></aside>
    <section class="preview" aria-label="手机交互原型">
      <div class="suite-toolbar"><select id="page-select" aria-label="跳转原型页面"></select><button id="theme-toggle" type="button" aria-label="切换深色模式">深色</button></div>
      <div class="phone-shell" id="phone">
        <div class="status-bar" aria-hidden="true"><span>9:41</span><span>••• <span class="battery">▰</span></span></div>
        <div id="screen-header"></div>
        <div id="screen" class="screen-scroll" tabindex="-1"></div>
        <div id="screen-footer"></div>
        <div class="home-indicator" aria-hidden="true"><span></span></div>
        <div class="sheet-shade" id="sheet-shade" hidden></div>
        <dialog id="sheet" aria-label="页面操作"></dialog>
        <div class="toast" role="status" id="toast"></div>
      </div>
      <div class="suite-caption"><span id="current-page-label"></span><span>可点击交互 · 示例数据</span></div>
    </section>
    <aside class="page-notes"><p class="note-eyebrow">沿用第二版视觉</p><h1 id="note-title"></h1><p id="note-desc"></p><div class="note-links" id="note-links"></div><div class="mini-palette"><i></i><i></i><i></i></div><p class="note-small">朱橙 · 豆沙粉 · 暖白<br>一套配色，不同的阅读节奏。</p><button type="button" class="overview-link" data-action="gallery">查看所有页面 <span class="icon" aria-hidden="true">&#61751;</span></button></aside>
  </main>
  <section class="gallery" id="gallery" aria-label="所有页面视觉总览" hidden><div class="gallery-heading"><div><p>黑洞英语 · 红粉阅读室</p><h1>从发现，到读懂。</h1><span>点击任一页面，进入交互原型。</span></div><button type="button" data-action="gallery">返回交互原型 <span class="icon" aria-hidden="true">&#61751;</span></button></div><div id="gallery-grid"></div></section>
</body>
</html>
